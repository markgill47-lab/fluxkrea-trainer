[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluxkrea"
version = "0.1.0"
description = "LoRA training tooling for FLUX.2 Klein and Krea 2 across a distributed lab fleet"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Mark Gill" }]

dependencies = [
    "pillow>=10.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "tomli-w>=1.0",
    # ai-toolkit reads YAML configs; the backend writes them.
    "pyyaml>=6.0",
    # The CLI is an API client, so it needs an HTTP client even on a machine
    # that never runs the daemon. core/ must never import this - guarded.
    "httpx>=0.27",
]

[project.optional-dependencies]
daemon = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]
keyring = ["keyring>=25.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
fk = "fluxkrea.cli.__main__:main"
fluxkrea = "fluxkrea.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fluxkrea"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "fluxkrea/_assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a second",
    "needs_weights: requires the vendored detector weights",
]
filterwarnings = [
    "error::DeprecationWarning:fluxkrea.*",
    # starlette's TestClient warns about httpx vs httpx2. It is a test-only
    # dependency and the warning is about a future starlette release.
    "ignore::UserWarning:starlette.testclient",
    "ignore:.*starlette.testclient.*:DeprecationWarning",
    "ignore:You should not use the 'timeout' argument with the TestClient.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
